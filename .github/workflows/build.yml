name: build
on: [push, workflow_dispatch]

env:
  # Вшиваемая модель. Чтобы сменить модель, поменяйте только эти две строки.
  # Если APK не собирается или не ставится из-за размера, возьмите 1.5B:
  # Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf (~1.1 ГБ) из bartowski/Qwen2.5-Coder-1.5B-Instruct-GGUF
  MODEL_FILE: Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf
  MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.0.12433566" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: model-${{ env.MODEL_FILE }}
      - name: Download model into assets
        run: |
          mkdir -p app/src/main/assets/models
          F="app/src/main/assets/models/junior-mini.gguf"
          if [ ! -s "$F" ]; then
            curl -L --fail --retry 5 --retry-delay 5 -o "$F" "$MODEL_URL"
          fi
          ls -l "$F"
          head -c 4 "$F" | grep -q GGUF
          test "$(stat -c%s "$F")" -gt 500000000
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Build
        shell: bash
        run: gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -nE '^e: |error:|What went wrong' -A4 build.log | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: junior
          compression-level: 0
          path: app/build/outputs/apk/debug/*.apk
